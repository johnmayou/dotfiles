[dotfiles]
"~/.zshrc" = "zsh/.zshrc"
"~/.zprofile" = "zsh/.zprofile"
"~/.gitconfig" = "git/.gitconfig"
"~/bin" = "bin"
"~/.claude/skills" = ".ai/skills"
"~/.claude/CLAUDE.md" = ".ai/AGENTS.md"
"~/.claude/agents" = ".claude/agents"
"~/.claude/settings.json" = ".claude/settings.json"
"~/.npmrc" = ".npmrc"
"~/Library/Preferences/pnpm/config.yaml" = ".config/pnpm/config.yaml"
"~/.config/uv/uv.toml" = ".config/uv/uv.toml"
"~/.gitignore_global" = "git/.gitignore_global"
"~/.config/atuin/config.toml" = ".config/atuin/config.toml"
"~/.config/bat/config" = ".config/bat/config"
"~/.config/cmux/cmux.json" = ".config/cmux/cmux.json"
"~/.config/ripgrep/rg.conf" = ".config/ripgrep/rg.conf"
"~/Library/Application Support/Code/User/keybindings.json" = ".config/vscode/keybindings.json"
"~/Library/Application Support/Code/User/settings.json" = ".config/vscode/settings.json"
"~/Library/Application Support/com.mitchellh.ghostty/config" = ".config/ghostty/config"
"~/Library/Application Support/eza/theme.yml" = ".config/eza/theme.yml"
"~/Library/Application Support/lazygit/config.yml" = ".config/lazygit/config.yml"
"~/Library/Preferences/glow/glow.yml" = ".config/glow/glow.yml"
"~/.config/mise" = { source = ".config/mise", mode = "symlink-each" }

[bootstrap.packages]
"brew:atuin" = "latest"
"brew:bat" = "latest"
"brew:cloc" = "latest"
"brew:direnv" = "latest"
"brew:eza" = "latest"
"brew:fd" = "latest"
"brew:fzf" = "latest"
"brew:gh" = "latest"
"brew:git-filter-repo" = "latest"
"brew:git-lfs" = "latest"
"brew:glow" = "latest"
"brew:just" = "latest"
"brew:lazygit" = "latest"
"brew:make" = "latest"
"brew:neovim" = "latest"
"brew:ripgrep" = "latest"
"brew:tmux" = "latest"
"brew:trufflehog" = "latest"
"brew:wget" = "latest"

"brew-cask:claude" = "latest"
"brew-cask:claude-code" = "latest"
"brew-cask:cleanshot" = "latest"
"brew-cask:cmux" = "latest"
"brew-cask:docker-desktop" = "latest"
"brew-cask:ghostty" = "latest"
"brew-cask:google-chrome" = "latest"
"brew-cask:google-drive" = "latest"
"brew-cask:obsidian" = "latest"
"brew-cask:postico" = "latest"
"brew-cask:visual-studio-code" = "latest"
"brew-cask:zoom" = "latest"

[bootstrap.macos.dock]
tilesize = 36
autohide = true
show_recents = false

[bootstrap.macos.keyboard]
key_repeat = 1
initial_key_repeat = 10

[bootstrap.macos.defaults.NSGlobalDomain]
NSAutomaticWindowAnimationsEnabled = false
NSAutomaticQuoteSubstitutionEnabled = false
NSAutomaticDashSubstitutionEnabled = false

[bootstrap.macos.defaults."com.apple.dock"]
expose-animation-duration = 0.1
springboard-show-duration = 0
springboard-hide-duration = 0
springboard-page-duration = 0

[tasks.sync]
description = "Pull this repo and converge the machine"
run = ["git pull --autostash --ff-only", "mise bootstrap --yes"]

[tasks.upgrade]
description = "Upgrade declared packages and tools"
run = ["mise bootstrap packages upgrade --yes", "mise upgrade"]

[tasks.vscode-extensions]
description = "Install VS Code extensions listed in .config/vscode/extensions.txt"
run = "xargs -L1 code --install-extension < .config/vscode/extensions.txt"

[tasks.stamp]
description = "Pin this machine's MISE_ENV in ~/.config/mise/miserc.toml (run once, explicitly)"
run = '''
#!/usr/bin/env bash
set -euo pipefail
if [ -z "${MISE_ENV:-}" ]; then
  echo "stamp: MISE_ENV is not set; run as: MISE_ENV=personal mise run stamp" >&2
  exit 1
fi
mkdir -p ~/.config/mise
printf 'env = [%s]\n' "$(printf '%s' "$MISE_ENV" | tr -d '[:space:]' | sed 's/[^,]*/"&"/g')" > ~/.config/mise/miserc.toml
echo "stamp: wrote ~/.config/mise/miserc.toml -> $(cat ~/.config/mise/miserc.toml)"
'''
